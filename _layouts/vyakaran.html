---
layout: default

---
<link rel="stylesheet" href="{{ '/assets/css/vyakaran.css' | relative_url }}">
<style>
/* ==========================================================
   GK-QUIZ LINKED STANDARDS FOR VYAKARAN DESK
========================================================== */
.page-wrapper {
    margin-top: 90px;
    display: flex;
    min-height: calc(100vh - 64px);
    position: relative;
    width: 100%;
}

/* ⬅️ LEFT COLUMN: CATALOG FIXED SIDEBAR */
.gk-sidebar {
    padding: 20px;
    padding-right: 0;
    width: 280px;
    flex-shrink: 0;
    background: var(--bg-surface);
    border-right: 1px solid var(--border-table);
    position: fixed;
    top: 62px;
    height: calc(100vh - 64px);
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--border-3) rgba(0,0,0,0);
    z-index: 2;
    transition: transform var(--ease-normal);
}

/* 📄 MIDDLE COLUMN: MAIN WORKING DYNAMIC WORKSPACE (CORRECTED CENTERING) */
.main-content {
    flex: 1;
    min-width: 0;
    padding: 5px;
    max-width: 920px;
    width: 100%;
  
    margin-left:300px; 
    box-sizing: border-box;
    display: block;
}

/* ==========================================================
   📱 MOBILE & TABLET MEDIA ADAPTATIONS (RESET MARGINS)
========================================================== */
@media (max-width: 1023px) {
    .main-content {
        width: 100%;
        flex: 0 0 100%;
        padding: 20px 16px;
        /* Mobile par sidebars collapse ho jate hain isliye margins auto resets */
        margin: 15px auto; 
    }
}

/* ➡️ RIGHT COLUMN: EXTENSION STICKY CARD SHELL */
.gk-sidebar-right {
    width: 280px;
    flex-shrink: 0;
    margin-left: 24px;
    position: fixed;
    right: 0;
    top: 62px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    padding: 15px;
    background: var(--bg-surface) !important;
    border-left: 1px solid var(--border-table);
    box-shadow: var(--shadow-1);
    z-index: var(--z-card);
    border-radius: 8px;
    position: relative;
}

.gk-sidebar-right::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--anim-glow-1), var(--anim-glow-2), var(--anim-glow-4), var(--anim-glow-5), var(--anim-glow-1));
    background-size: 300% 100%;
    animation: sidebarGlow 6s linear infinite;
    opacity: .12;
    pointer-events: none;
}

@keyframes sidebarGlow {
    0% { background-position: 0% 50% }
    100% { background-position: 300% 50% }
}

/* ==========================================================
   📱 MOBILE & TABLET MEDIA ADAPTATIONS (1023px BREAKPOINT)
========================================================== */
@media (max-width: 1023px) {
    .page-wrapper {
        flex-wrap: wrap;
    }
    .main-content {
        width: 100%;
        flex: 0 0 100%;
        padding: 20px 16px;
    }
    .gk-sidebar {
        position: fixed;
        top: 56px;
        left: 0;
        height: 100%;
        z-index: 90;
        transform: translateX(-100%);
        box-shadow: var(--shadow-3);
        width: 240px;
    }
    .gk-sidebar.open {
        transform: translateX(0);
    }
    .gk-sidebar-right {
        width: 100%;
        margin-top: 24px;
        margin-left: 0;
        margin-right: 0;
        padding: 16px;
        display: block;
        position: static;
        top: auto;
        right: auto;
        height: auto;
        order: 2;
    }
}

@media (max-width: 639px) {
    .main-content {
        padding: 16px 12px;
    }
}
</style>

<div class="page-wrapper">
    
    <div class="gk-sidebar" id="vyakaranAsideMenu">
        {% include sidebars/vyakaran.html %}
    </div>

    <main class="main-content">
        {{ content }}
    </main>

    <div class="gk-sidebar-right">
        {% include right-sidebar.html %}
    </div>

</div>

<div class="sidebar-overlay" id="asideBackdrop" onclick="toggleVAside()"></div>

<script>
function toggleVAside() {
    const aside = document.getElementById('vyakaranAsideMenu');
    const backdrop = document.getElementById('asideBackdrop');
    if (aside && backdrop) {
        aside.classList.toggle('open');
        backdrop.classList.toggle('active');
    }
}
</script>
