<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Primary Meta -->
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="keywords" content="{% if page.keywords %}{{ page.keywords }}{% else %}TyagiHub, Tyagi MultiTech, learn, tools, editor, apps, stock, shield{% endif %}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="robots" content="index, follow">

  <!-- Canonical -->
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- OpenGraph (Social Sharing) -->
  <meta property="og:type"        content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title"       content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url"         content="{{ site.url }}{{ page.url }}">
  <meta property="og:site_name"   content="{{ site.title }}">
  <meta property="og:image"       content="{{ site.url }}/assets/images/og-default.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="twitter:image"       content="{{ site.url }}/assets/images/og-default.jpg">
  <meta name="twitter:site"        content="@TyagiMultiTech">

  <!-- Favicon -->
  <link rel="icon"             href="/assets/images/favicon.ico" sizes="any">
  <link rel="icon"             href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest"         href="/site.webmanifest">
  <meta name="theme-color"    content="#f5a623">

  <!-- LOCAL CSS — NO CDN -->
  <link rel="stylesheet" href="https://himanshutyagiji.github.io/TyagiHub/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/TyagiHub/assets/css/search.css">
  {% if page.extra_css %}
    {% for css in page.extra_css %}
      <link rel="stylesheet" href="{{ css }}">
    {% endfor %}
  {% endif %}

  <!-- Preload critical fonts -->
  <link rel="preload" href="/assets/fonts/Outfit-Regular.woff2"      as="font" type="font/woff2" crossorigin="anonymous">
  <link rel="preload" href="/assets/fonts/SpaceGrotesk-Bold.woff2"   as="font" type="font/woff2" crossorigin="anonymous">

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Tyagi MultiTech",
    "url": "https://tyagihub.in",
    "logo": "https://tyagihub.in/assets/images/logo.svg",
    "sameAs": [
      "https://github.com/TyagiMultiTech"
    ]
  }
  </script>
</head>

<body>

  <!-- Skip to content (accessibility) -->
  <a href="#main-content" class="sr-only">Skip to main content</a>

  <!-- NAVBAR -->
  {% include navbar.html %}

  <!-- MOBILE NAV -->
  {% include mobile-nav.html %}

  <!-- MAIN CONTENT -->
  <main id="main-content">
    {{ content }}
  </main>

  <!-- FOOTER -->
  {% include footer.html %}

  <!-- LOCAL JS — NO CDN -->
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/search.js" defer></script>
  {% if page.extra_js %}
    {% for js in page.extra_js %}
      <script src="{{ js }}" defer></script>
    {% endfor %}
  {% endif %}

</body>
</html>
