---
layout: default
title: "Authors & Creators Hub"
lang_switch: false
comments: false
---

<!-- Premium Independent Profile Layout Styling Layer -->
<style>
  .premium-profile-wrapper {
    max-width: var(--container-max, 1200px);
    margin: var(--space-12, 48px) auto;
    padding: 0 var(--space-4, 16px);
    min-height: 75vh;
    margin-top: 70px;
  }

  /* Header Architecture */
  .profile-header-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: var(--space-8, 32px);
    text-align: center;
  }

  .profile-main-heading {
    font-family: var(--font-display), sans-serif;
    font-size: var(--fs-2xl, 2.25rem);
    font-weight: var(--fw-black, 600);
    color: var(--text-heading);
    letter-spacing: -0.02em;
    margin: 0;
  }

  /* 💎 DYNAMIC IDENTITY SHOWCASE BANNER (Fixes Content Detail Visibility) */
  .identity-showcase-panel {
    background: var(--bg-surface);
    border: 1px solid var(--clr-border);
    border-radius: var(--radius-lg, 18px);
    padding: var(--space-6, 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
    margin-bottom: var(--space-10, 40px);
    box-shadow: var(--shadow-sm);
  }

  @media(min-width: 768px) {
    .identity-showcase-panel {
      flex-direction: row;
      text-align: left;
      padding: var(--space-8, 32px);
    }
  }

  .showcase-avatar-box {
    width: 100px;
    height: 100px;
    flex-shrink: 0;
    border-radius: var(--radius-full, 9999px);
    border: 2px solid var(--clr-accent);
    background: var(--bg-body);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .showcase-details {
    flex-grow: 1;
  }

  .showcase-name {
    font-family: var(--font-display), sans-serif;
    font-size: var(--fs-xl, 1.75rem);
    font-weight: var(--fw-black, 600);
    color: var(--text-heading);
    margin: 0 0 6px 0;
  }

  .showcase-badge {
    font-size: var(--fs-xs, 0.89rem);
    font-weight: var(--fw-bold, 550);
    color: var(--clr-accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .showcase-bio {
    font-size: var(--fs-sm, 0.95rem);
    color: var(--text-paragraph);
    line-height: var(--lh-normal, 1.6);
    margin: 0;
  }

  /* 👥 PERSISTENT MULTI-AUTHOR VISUAL BLOCKS HACK CONTAINER */
  .authors-selector-hub {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-4, 16px);
    margin-bottom: var(--space-12, 48px);
  }

  @media(min-width: 768px) {
    .authors-selector-hub {
      grid-template-columns: repeat(2, 1fr);
    }
    .authors-selector-hub .all-creators-block-card {
      grid-column: 1 / -1; /* All Creators takes full width for distinct aesthetic separation */
    }
  }
  
  @media(min-width: 1024px) {
    .authors-selector-hub {
      grid-template-columns: repeat(3, 1fr);
    }
    .authors-selector-hub .all-creators-block-card {
      grid-column: auto; /* Fits back perfectly into grid structure on desktop viewports */
    }
  }

  .author-profile-block-card {
    background: var(--bg-surface);
    border: 1px solid var(--clr-border);
    border-radius: var(--radius-lg, 18px);
    padding: var(--space-5, 20px);
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform var(--ease-normal, 250ms), border-color var(--ease-normal, 250ms), box-shadow var(--ease-normal, 250ms);
    box-shadow: var(--shadow-sm);
  }

  .author-profile-block-card:hover {
    transform: translateY(-4px);
    border-color: var(--clr-accent);
    box-shadow: var(--shadow-md);
  }

  .author-profile-block-card.active-profile-state {
    border-color: var(--clr-accent);
    background: rgba(255, 255, 255, 0.01);
    box-shadow: var(--shadow-accent);
  }

  /* 🌌 Premium Circle SVG Avatar Canvas (Clean Circular Vector Track) */
  .profile-block-svg-avatar {
    width: 68px;
    height: 68px;
    flex-shrink: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .profile-block-svg-avatar svg {
    width: 100%;
    height: 100%;
  }

  /* SVG Structural Components Default State Layout Frame mapping */
  .profile-block-svg-avatar .svg-pulse-ring,
  .profile-block-svg-avatar .svg-dash-orbit {
    transform-origin: center;
    transition: all 0.3s ease;
  }

  .profile-block-svg-avatar .svg-pulse-ring { stroke: var(--clr-border); opacity: 0.3; }
  .profile-block-svg-avatar .svg-dash-orbit { stroke: var(--clr-border-2); stroke-dasharray: 5, 3; opacity: 0.4; }
  .profile-block-svg-avatar .svg-core-circle { fill: var(--clr-border-2); }

  /* 🔥 Conditional Active State Core Animation Sync Hook */
  .author-profile-block-card.is-animating .svg-pulse-ring {
    animation: svgPulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    stroke: var(--text-4, #60a5fa); 
    opacity: 0.6;
  }

  .author-profile-block-card.is-animating .svg-dash-orbit {
    animation: svgRotate 15s linear infinite;
    stroke: var(--clr-accent);
    stroke-dasharray: 5, 3;
    opacity: 0.8;
  }

  .author-profile-block-card.is-animating .svg-core-circle {
    fill: var(--clr-accent);
  }

  @keyframes svgPulse {
    0% { transform: scale(0.92); opacity: 0.7; }
    50% { transform: scale(1.06); opacity: 0.2; }
    100% { transform: scale(0.92); opacity: 0.7; }
  }

  @keyframes svgRotate { 100% { transform: rotate(360deg); } }

  .profile-card-details { flex-grow: 1; }
  .profile-card-name { color: var(--text-heading); margin: 0 0 2px 0; font-family: var(--font-display); font-size: 17px; font-weight: var(--fw-black, 600); }
  .profile-card-role { font-size: 11px; font-weight: var(--fw-bold, 550); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .active-profile-state .profile-card-role { color: var(--clr-accent); }
  .profile-card-counter-tag { font-size: 12px; color: var(--text-muted); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

  /* Feed Header Line Layout Layer */
  .profile-feed-header-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-8, 32px);
    border-bottom: 1px solid var(--clr-border);
    padding-bottom: var(--space-3, 12px);
    gap: 15px;
    flex-wrap: wrap;
    scroll-margin-top: 90px;
  }

  .feed-section-title { font-family: var(--font-display), sans-serif; font-size: var(--fs-lg, 1.375rem); font-weight: var(--fw-black, 600); color: var(--text-heading); margin: 0; }

  .live-lang-switch-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-surface);
    border: 1px solid var(--clr-border);
    padding: 6px 14px;
    border-radius: var(--radius-full, 9999px);
    cursor: pointer;
    transition: all var(--ease-normal, 250ms);
    font-family: var(--font-body), sans-serif;
    font-size: var(--fs-xs, 0.89rem);
    font-weight: var(--fw-bold, 550);
    color: var(--clr-accent);
    user-select: none;
    box-shadow: var(--shadow-sm);
  }

  .live-lang-switch-box:hover { border-color: var(--clr-accent); background: var(--hover-bg-1); }

  /* Strict 3-Column 15-Post Grid System */
  .premium-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-8, 32px); }
  @media(min-width: 768px) { .premium-grid { grid-template-columns: repeat(2, 1fr); } }
  @media(min-width: 1024px) { .premium-grid { grid-template-columns: repeat(3, 1fr); } }

  .luxury-card {
    background: var(--bg-surface);
    border: 1px solid var(--clr-border);
    border-radius: var(--radius-lg, 18px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform var(--ease-normal, 250ms), border-color var(--ease-normal, 250ms), box-shadow var(--ease-normal, 250ms);
    box-shadow: var(--shadow-sm);
  }
  .luxury-card:hover { transform: translateY(-5px); border-color: var(--clr-border-2); box-shadow: var(--shadow-md); }
  .card-media-wrap { width: 100%; aspect-ratio: 16 / 10; overflow: hidden; position: relative; background: var(--bg-body); }
  .card-media-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--ease-slow, 400ms); }
  .luxury-card:hover .card-media-wrap img { transform: scale(1.03); }
  .card-body-content { padding: var(--space-5, 20px); display: flex; flex-direction: column; flex-grow: 1; }
  .card-meta-line { display: flex; align-items: center; gap: var(--space-3, 12px); font-size: var(--fs-xs, 0.89rem); color: var(--text-muted); margin-bottom: var(--space-3, 12px); }
  .card-title-anchor { font-family: var(--font-display), sans-serif; font-size: var(--fs-md, 1.125rem); font-weight: var(--fw-bold, 550); line-height: var(--lh-snug, 1.3); color: var(--text-heading); text-decoration: none; margin-bottom: var(--space-2, 8px); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: color var(--ease-fast, 150ms); }
  .card-title-anchor:hover { color: var(--clr-accent); }
  .card-desc-text { font-size: var(--fs-sm, 0.95rem); color: var(--text-paragraph); line-height: var(--lh-normal, 1.6); margin: 0 0 var(--space-5, 20px) 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer-action { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-3, 12px); border-top: 1px solid var(--clr-border); }
  .premium-read-btn { font-size: var(--fs-sm, 0.95rem); font-weight: var(--fw-bold, 550); color: var(--clr-accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .premium-read-btn:hover { color: var(--clr-accent-2); }
  .premium-share-icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: var(--space-1, 4px); border-radius: var(--radius-full, 9999px); display: flex; align-items: center; justify-content: center; }
  .premium-share-icon-btn:hover { color: var(--text-heading); }
  .luxury-spinner { grid-column: 1 / -1; text-align: center; padding: var(--space-12, 48px) 0; }
</style>

<!-- Main Container Element -->
<main class="premium-profile-wrapper">
    
    <div class="cat-header-zone">
        <h1 id="category-posts-heading" class="profile-main-heading">Creator Dashboard</h1>
    </div>

    <!-- 💎 DYNAMIC IDENTITY SHOWCASE PANEL BLUEPRINT (Fills detailed profile strings safely) -->
    <div id="dynamic-identity-showcase" class="identity-showcase-panel">
        <div class="luxury-spinner" style="color:var(--clr-accent); width:100%;"><i class="fas fa-spinner fa-spin" style="font-size:24px;"></i></div>
    </div>

    <!-- 👥 PERSISTENT MULTI-AUTHOR VISUAL BLOCKS SWITCHER HUB TRACK -->
    <div id="authors-selector-track-container" class="authors-selector-hub"></div>

    <!-- Feed Controller Zone -->
    <div id="profile-feed-anchor-bar" class="profile-feed-header-line">
        <h2 id="author-posts-heading" class="feed-section-title">Published Articles Archive</h2>
        
        <!-- Live Language Toggle Selector -->
        <div id="live-lang-switch-trigger" class="live-lang-switch-box">
            <i class="fa-solid fa-earth-americas"></i>
            <span id="lang-switch-text-node">🌐 हिंदी में पढ़ें</span>
        </div>
    </div>
    
    <!-- Strict 15-Post Max 3-Column Profile Matrix Layout Grid -->
    <div id="author-post-grid" class="premium-grid"></div>
</main>

<!-- Unified Site Dataset Architecture JSON Layer Buffer -->
<script id="tyagihub-master-json" type="application/json">
[
  {% assign all_site_posts = "" | split: "" %}
  {% for p in site.posts %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  {% for p in site.posts_hi %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  {% for p in site.shield %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  {% for p in site.shield_hi %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  
  {% for p in all_site_posts %}
    {
      "title": {{ p.title | jsonify }},
      "url": {{ p.url | relative_url | jsonify }},
      "description": {{ p.description | default: p.excerpt | strip_html | truncate: 120 | jsonify }},
      "image": {{ p.image | default: '/assets/images/default-thumb.png' | jsonify }},
      "date": {{ p.date | date: "%d %b %Y" | jsonify }},
      "lang": {{ p.lang | default: 'en' | jsonify }},
      "author": {{ p.author | default: "Himanshu Tyagi" | jsonify }},
      "category": {% if p.categories %}{{ p.categories[0] | jsonify }}{% else %}{{ p.category | jsonify }}{% endif %},
      "display_chip": {% if p.categories %}{{ p.categories[0] | replace: "-", " " | replace: "_", " " | capitalize | jsonify }}{% else %}{{ p.category | replace: "-", " " | replace: "_", " " | capitalize | jsonify }}{% endif %}
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const selectorTrack = document.getElementById('authors-selector-track-container');
    const showcasePanel = document.getElementById('dynamic-identity-showcase');
    const postsGrid = document.getElementById('author-post-grid');
    const postsHeading = document.getElementById('author-posts-heading');
    const feedAnchorBar = document.getElementById('profile-feed-anchor-bar');
    
    const pageMainHeading = document.getElementById('category-posts-heading');
    const langSwitchBox = document.getElementById('live-lang-switch-trigger');
    const langSwitchText = document.getElementById('lang-switch-text-node');

    const isHindiContext = window.location.pathname.includes('/hi/') || document.referrer.includes('/hi/');
    let activeLang = isHindiContext ? "hi" : "en";

    const normalizeStr = (str) => {
        if (!str) return "";
        return str.toString().toLowerCase().replace(/[-_\s]/g, '').trim();
    };

    const urlParams = new URLSearchParams(window.location.search);
    let currentSelectedAuthorKey = normalizeStr(urlParams.get('author') || "all");

    let rawUniversalArrayBuffer = [];
    let languageScannedDataset = [];
    let filteredPostsSubset = [];

    // 🌌 CLEAN CIRCLE VECTOR BASED SVG LOGO GENERATOR
    const generateAuthorAvatarSVG = (name, dimensions = 68, fontSize = 20, isInnerWhite = false) => {
        const words = name.split(' ').filter(Boolean);
        let initials = words[0] ? words[0][0] : 'T';
        if (words.length > 1) { initials += words[words.length - 1][0]; }
        initials = initials.toUpperCase();
        const textFillColor = isInnerWhite ? "var(--bg-surface)" : "var(--bg-body)";

        return `
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle class="svg-pulse-ring" cx="50" cy="50" r="44" stroke-width="2"/>
                <circle class="svg-dash-orbit" cx="50" cy="50" r="34" stroke-width="1.5"/>
                <circle class="svg-core-circle" cx="50" cy="50" r="26" style="fill: hotpink;"></circle>
                <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="${fontSize}" font-weight="800" fill="${textFillColor}" font-family="var(--font-display), sans-serif">${initials}</text>
            </svg>
        `;
    };

    try {
        const rawJsonData = document.getElementById('tyagihub-master-json').textContent;
        rawUniversalArrayBuffer = JSON.parse(rawJsonData || "[]");

        syncGlobalStaticUIStrings();
        executeCoreProfileRefreshPipeline(false); 

    } catch (e) {
        console.error("Profile cluster engine failure:", e);
        showcasePanel.innerHTML = `<p style="color:var(--text-muted); text-align:center;">Directory Frame Crash.</p>`;
    }

    if (langSwitchBox) {
        langSwitchBox.addEventListener('click', () => {
            activeLang = activeLang === "en" ? "hi" : "en";
            syncGlobalStaticUIStrings();
            executeCoreProfileRefreshPipeline(false);
        });
    }

    function syncGlobalStaticUIStrings() {
        if (activeLang === "hi") {
            langSwitchText.innerText = "🌐 Switch to English";
            pageMainHeading.innerText = "लेखक एवं क्रिएटर डैशबोर्ड";
        } else {
            langSwitchText.innerText = "🌐 हिंदी में पढ़ें";
            pageMainHeading.innerText = "Creator Profiles Hub";
        }
    }

    function executeCoreProfileRefreshPipeline(shouldScroll = false) {
        languageScannedDataset = rawUniversalArrayBuffer.filter(post => post.lang === activeLang);
        buildAuthorsSelectorBlocks();
        applyAuthorFilteringPipeline(shouldScroll);
    }

    // 🎯 STEP 1: RENDER PERSISTENT CONTROLLER TRACK CARD BLOCKS (STRICT LOCK BY COUNT SORTING 🚀)
    function buildAuthorsSelectorBlocks() {
        selectorTrack.innerHTML = '';
        
        // A. Separate aggregate map parsing layout metrics properties
        const authorRegistryMap = new Map();
        languageScannedDataset.forEach(p => {
            const rawAuthorName = p.author.trim();
            const lowerKey = normalizeStr(rawAuthorName);
            
            if (!authorRegistryMap.has(lowerKey)) {
                authorRegistryMap.set(lowerKey, { rawName: rawAuthorName, count: 1 });
            } else {
                authorRegistryMap.get(lowerKey).count += 1;
            }
        });

        // 🔥 CRITICAL FIX: Convert map values to sorted array based strictly on POST COUNT (Descending)
        // This guarantees that Himanshu Tyagi stays index 1 consistently regardless of lang code shifts!
        const sortedAuthorsArray = Array.from(authorRegistryMap.values()).sort((x, y) => y.count - x.count);

        // B. Inject 'All Creators' Hub button chip block first
        const allLabel = activeLang === "hi" ? "सभी क्रिएटर्स" : "All Creators";
        const allRole = activeLang === "hi" ? "पूर्ण निर्देशिका" : "Unified Team Directory";
        const allPostsLabel = activeLang === "hi" ? "कुल लेख संग्रह" : "Total Content Logs";
        const allAvatar = generateAuthorAvatarSVG("ALL");

        const allCard = document.createElement('div');
        const isAllAnimating = currentSelectedAuthorKey === "all" ? "active-profile-state is-animating" : "";
        allCard.className = `author-profile-block-card all-creators-block-card ${isAllAnimating}`;
        allCard.innerHTML = `
            <div class="profile-block-svg-avatar">${allAvatar}</div>
            <div class="profile-card-details">
                <div class="profile-card-role">${allRole}</div>
                <h3 class="profile-card-name">${allLabel}</h3>
                <span class="profile-card-counter-tag">
                    <i class="fa-solid fa-book-open" style="font-size:11px; color:var(--clr-accent);"></i> ${languageScannedDataset.length} ${allPostsLabel}
                </span>
            </div>
        `;
        allCard.addEventListener('click', () => switchAuthorProfileState("all", allCard));
        selectorTrack.appendChild(allCard);

        // C. Loop over sorted list ensuring bulletproof rendering order structure
        sortedAuthorsArray.forEach((data) => {
            const normKey = normalizeStr(data.rawName);
            const authorAvatarSvg = generateAuthorAvatarSVG(data.rawName);
            
            let badgeTitle = activeLang === "hi" ? "सत्यापित लेखक" : "Verified Contributor";
            if (normKey === "himanshutyagi") {
                badgeTitle = activeLang === "hi" ? "मुख्य लेखक एवं क्रिएटर" : "Platform Architect";
            }
            const articlesLabel = activeLang === "hi" ? "प्रकाशित लेख" : "Articles Logged";

            const card = document.createElement('div');
            const isTargetAnimating = currentSelectedAuthorKey === normKey ? "active-profile-state is-animating" : "";
            card.className = `author-profile-block-card ${isTargetAnimating}`;
            card.innerHTML = `
                <div class="profile-block-svg-avatar">${authorAvatarSvg}</div>
                <div class="profile-card-details">
                    <div class="profile-card-role">${badgeTitle}</div>
                    <h3 class="profile-card-name">${data.rawName}</h3>
                    <span class="profile-card-counter-tag">
                        <i class="fa-solid fa-book-open" style="font-size:11px; color:var(--clr-accent);"></i> ${data.count} ${articlesLabel}
                    </span>
                </div>
            `;
            card.addEventListener('click', () => switchAuthorProfileState(normKey, card));
            selectorTrack.appendChild(card);
        });
    }

    function switchAuthorProfileState(targetNormAuthorKey, clickedCardElement) {
        document.querySelectorAll('.author-profile-block-card').forEach(c => {
            c.classList.remove('active-profile-state', 'is-animating');
        });
        
        clickedCardElement.classList.add('active-profile-state', 'is-animating');
        currentSelectedAuthorKey = targetNormAuthorKey;
        
        const dynamicQueryParam = targetNormAuthorKey === "all" ? window.location.pathname : `?author=${targetNormAuthorKey}`;
        window.history.replaceState({}, "", dynamicQueryParam);
        
        executeCoreProfileRefreshPipeline(true); 
    }

    // 🎯 STEP 2: CHANNELS DATA FILTER PIPELINE (WITH BANNER & SCROLL INTEGRATIONS)
    function applyAuthorFilteringPipeline(shouldScroll = false) {
        filteredPostsSubset = languageScannedDataset.filter(post => {
            if (currentSelectedAuthorKey !== "all") {
                return normalizeStr(post.author) === currentSelectedAuthorKey;
            }
            return true;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));

        if (activeLang === "hi") {
            postsHeading.innerText = currentSelectedAuthorKey === "all" ? "सभी प्रकाशित लेख संग्रह" : "लेखक के विशिष्ट लेख";
        } else {
            postsHeading.innerText = currentSelectedAuthorKey === "all" ? "All Platform Publications" : "Author Contributions Archive";
        }

        renderIdentityShowcaseBanner();
        renderAuthorArticlesGridCanvas();

        if (shouldScroll && feedAnchorBar) {
            feedAnchorBar.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    // 🎯 STEP 3: RENDER THE LUXURY SHOWCASE PROFILE INFORMATION BANNER
    function renderIdentityShowcaseBanner() {
        if (!showcasePanel) return;

        let titleName = activeLang === "hi" ? "सभी क्रिएटर्स निर्देशिका" : "All TyagiHub Creators";
        let roleBadgeText = activeLang === "hi" ? "सत्यापित कोर टीम" : "Verified Core Collective";
        let targetBio = activeLang === "hi" 
            ? "त्यागीहब प्लेटफॉर्म के सक्रिय लेखकों और तकनीकी क्रिएटर्स का केंद्रीय हब। यहाँ आप विभिन्न डिजिटल श्रेणियों के विश्लेषण पढ़ सकते हैं।" 
            : "Central directory tracking production engineering tutorials, security infrastructure logs, and software review logs published across our creator network.";

        if (currentSelectedAuthorKey !== "all") {
            // Find target matching records to pull native raw name presentation string safely
            const targetSamplePost = filteredPostsSubset[0];
            if (targetSamplePost) {
                titleName = targetSamplePost.author;
                if (currentSelectedAuthorKey === "himanshutyagi") {
                    roleBadgeText = activeLang === "hi" ? "मुख्य लेखक एवं क्रिएटर" : "Platform Architect & Independent Creator";
                    targetBio = activeLang === "hi" 
                        ? "स्वतंत्र डिजिटल क्रिएटर और कंप्यूटर एप्लीकेशन डेवलपर, जो शैक्षणिक प्लेटफॉर्म और मोबाइल ऐप्स के निर्माण पर ध्यान केंद्रित कर रहे हैं।" 
                        : "Independent digital creator and application developer focused on building educational platforms, utility toolkits, and robust software architectures.";
                } else {
                    roleBadgeText = activeLang === "hi" ? "सत्यापित लेखक" : "Verified Contributor";
                    targetBio = activeLang === "hi" 
                        ? `त्यागीहब पर ${titleName} द्वारा लिखे गए सभी मूल योगदानों, प्रलेखन लॉग और शोध लेखों की समीक्षा करें।` 
                        : `Explore all core documentation logs, code structures, and technical insights published by ${titleName}.`;
                }
            }
        }

        const bannerAvatarSvg = generateAuthorAvatarSVG(titleName, 100, 24, true);

        showcasePanel.innerHTML = `
            <div class="showcase-avatar-box">${bannerAvatarSvg}</div>
            <div class="showcase-details">
                <div class="showcase-badge"><i class="fa-solid fa-shield-halved"></i> ${roleBadgeText}</div>
                <h2 class="showcase-name">${titleName}</h2>
                <p class="showcase-bio">${targetBio}</p>
            </div>
        `;
    }

    // 🎯 STEP 4: DRAW 15-POST RESPONSIVE CARD Matrix LAYOUT
    function renderAuthorArticlesGridCanvas() {
        postsGrid.innerHTML = '';

        if (filteredPostsSubset.length === 0) {
            postsGrid.innerHTML = activeLang === "hi"
                ? '<p style="color:var(--text-muted); text-align:center; padding:40px; grid-column:1/-1;">इस लेखक द्वारा इस भाषा में कोई लेख नहीं मिला।</p>'
                : '<p style="color:var(--text-muted); text-align:center; padding:40px; grid-column:1/-1;">No matching records logged under this creator profile viewport chunk.</p>';
            return;
        }

        const clampedFifteenSliceChunk = filteredPostsSubset.slice(0, 15);

        clampedFifteenSliceChunk.forEach(p => {
            const readLabel = activeLang === "hi" ? "पूरा पढ़ें" : "Read More";

            const cardHTML = `
                <article class="luxury-card">
                    <div class="card-media-wrap">
                        <img src="${p.image}" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="card-body-content">
                        <div class="card-meta-line">
                            <span><i class="fa-regular fa-calendar"></i> ${p.date}</span>
                            <span>•</span>
                            <span>🧠 ${p.display_chip}</span>
                        </div>
                        <a href="${p.url}" class="card-title-anchor">${p.title}</a>
                        <p class="card-desc-text">${p.description}</p>
                        
                        <div class="card-footer-action">
                            <a href="${p.url}" class="premium-read-btn">
                                ${readLabel} <i class="fa-solid fa-arrow-right-long" style="font-size:12px; margin-left:4px;"></i>
                            </a>
                            <button class="premium-share-icon-btn" onclick="triggerNativeSystemShare('${p.title.replace(/'/g, "\\'")}', '${p.url}')" aria-label="Share article">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="18" cy="5" r="3"></circle>
                                    <circle cx="6" cy="12" r="3"></circle>
                                    <circle cx="18" cy="19" r="3"></circle>
                                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </article>
            `;
            postsGrid.insertAdjacentHTML('beforeend', cardHTML);
        });
    }
});

function triggerNativeSystemShare(title, path) {
    const fullUrl = `${window.location.origin}${path}`;
    if (navigator.share) {
        navigator.share({ title: title, url: fullUrl }).catch(console.error);
    } else {
        navigator.clipboard.writeText(fullUrl).then(() => alert("Link copied to clipboard!"));
    }
}
</script>
