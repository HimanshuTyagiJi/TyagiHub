<!-- _includes/navbar.html -->
<header class="navbar" role="banner" aria-label="Main navigation">
  <div class="container">
    <div class="navbar__inner">

      <!-- Logo -->
      <a href="/" class="navbar__logo" aria-label="TyagiHub Home">
        <div class="navbar__logo-icon" aria-hidden="true">T</div>
        Tyagi<span>Hub</span>
      </a>

      <!-- Desktop Navigation -->
      <nav class="navbar__nav" role="navigation" aria-label="Primary">
        <a href="/learn/"  class="navbar__link">Learn</a>
        <a href="/editor/" class="navbar__link">Editor</a>
        <a href="/tools/"  class="navbar__link">Tools</a>
        <a href="/stock/"  class="navbar__link">Stock</a>
        <a href="/apps/"   class="navbar__link">Apps</a>
        <a href="/shield/" class="navbar__link">Shield</a>
        <a href="/blog/"   class="navbar__link">Blog</a>
      </nav>

      <!-- Actions -->
      <div class="navbar__actions">

        <!-- Search Icon -->
        <button class="navbar-search-btn" id="navbar-search-btn"
                aria-label="Search TyagiHub" title="Search (press /)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Theme Toggle -->
        <button class="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1"    x2="12" y2="3"></line>
            <line x1="12" y1="21"   x2="12" y2="23"></line>
            <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1"  y1="12" x2="3"  y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"></line>
            <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Docs — desktop only -->
        <a href="/docs/" class="btn btn-outline btn-sm navbar__docs-link">Docs</a>

        <!-- Sign In -->
        <a href="#" class="btn btn-primary btn-sm"
           onclick="TyagiHub.Toast.show('Authentication coming soon!', 'info'); return false;">
          Sign In
        </a>

        <!-- Hamburger — mobile only -->
        <button class="navbar__hamburger"
                aria-label="Toggle menu"
                aria-expanded="false"
                aria-controls="mobile-nav">
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>
    </div>
  </div>
</header>

<!-- SEARCH OVERLAY -->
<div id="search-overlay" class="search-overlay" aria-hidden="true"></div>

<!-- SEARCH BOX -->
<div id="search-box" class="search-box" role="combobox"
     aria-expanded="false" aria-haspopup="listbox">

  <div class="search-box__input-row">
    <span class="search-box__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </span>

    <input type="search" id="search-input" class="search-box__input"
           placeholder="Tools, courses, apps dhundho..."
           aria-label="Search TyagiHub"
           autocomplete="off" spellcheck="false">

    <button class="search-box__close" id="search-close"
            aria-label="Close search">ESC</button>
  </div>

  <!-- Results -->
  <div class="search-results" role="listbox">
    <div class="search-results__header" id="search-results-header"></div>
    <div id="search-results-list" role="group"></div>
    <div class="search-no-results" id="search-no-results">
      <div class="search-no-results__icon">🔍</div>
      <div class="search-no-results__text">Koi result nahi mila</div>
    </div>
    <div class="search-keyboard-hint" aria-hidden="true">
      <span class="search-kbd"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
      <span class="search-kbd"><kbd>Enter</kbd> Open</span>
      <span class="search-kbd"><kbd>ESC</kbd> Close</span>
      <span class="search-kbd"><kbd>/</kbd> Open</span>
    </div>
  </div>

</div>
