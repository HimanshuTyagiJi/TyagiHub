<!-- English Categories -->
<div class="nav-section">
  <div class="nav-section-label">English Categories</div>

  <div style="color:red;font-size:12px;">
    English Count: {{ site.categories.english | size }}
  </div>

  {% for cat in site.categories.english %}
    <a href="{{ cat.url | relative_url }}"
       class="nav-item{% if page.category_id == cat.id %} active{% endif %}">
      <span class="nav-item-icon">📖</span>
      <span class="nav-item-label">{{ cat.title }}</span>
    </a>
  {% endfor %}
</div>
