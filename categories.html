---
layout: default
title: "Categories | TyagiHub"
extra_css:
  - /assets/css/discover.css
---

<main class="container" style="margin-top: 40px; min-height: 60vh; padding: 0 15px;">
    <div id="category-posts-container">
        <!-- Dynamic Heading updated based on Lang and Category -->
        <h1 id="category-posts-heading" style="margin-bottom: 30px; font-weight: 600; color: var(--clr-heading);">Loading Category...</h1>
        
        <!-- Standardized Post Grid synced with Discover layout framework -->
        <div id="category-post-grid" class="static-seo-load" style="display: flex; flex-direction: column; gap: 20px;">
            <div class="spinner" style="text-align: center; padding: 40px; color: var(--text-muted);">
               <i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i>
            </div>
        </div>
    </div>
</main>

<!-- Hidden Global Unified JSON Buffer mapping all site variables cleanly -->
<script id="tyagihub-master-json" type="application/json">
[
  {% assign all_site_posts = "" | split: "" %}
  {% for p in site.posts %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  {% for p in site.posts_hi %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  {% for p in site.shield %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  {% for p in site.shield_hi %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  
  {% for p in all_site_posts %}
    {
      "title": {{ p.title | jsonify }},
      "url": {{ p.url | relative_url | jsonify }},
      "description": {{ p.description | default: p.excerpt | strip_html | truncate: 110 | jsonify }},
      "image": {{ p.image | default: '/assets/images/default-thumb.png' | jsonify }},
      "date": {{ p.date | date: "%d %b %Y" | jsonify }},
      "lang": {{ p.lang | default: 'en' | jsonify }},
      "category": {% if p.categories %}{{ p.categories[0] | downcase | jsonify }}{% else %}{{ p.category | downcase | jsonify }}{% endif %},
      "display_chip": {% if p.categories %}{{ p.categories[0] | replace: "-", " " | replace: "_", " " | capitalize | jsonify }}{% else %}{{ p.category | replace: "-", " " | replace: "_", " " | capitalize | jsonify }}{% endif %}
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const postsGrid = document.getElementById('category-post-grid');
    const postsHeading = document.getElementById('category-posts-heading');

    const urlParams = new URLSearchParams(window.location.search);
    const categoryQuery = urlParams.get('category');

    if (!categoryQuery) {
        postsHeading.textContent = 'No Category Specified';
        postsGrid.innerHTML = `<p style="color: var(--text-muted); padding: 20px;">Please select a valid category from the feed.</p>`;
        return;
    }

    // 🎯 Step 1: Detect runtime layout language context safely
    // Check if URL path includes /hi/ or document referrer context hints towards Hindi zone
    const isHindiContext = window.location.pathname.includes('/hi/') || document.referrer.includes('/hi/');
    const activeLang = isHindiContext ? "hi" : "en";

    // 🎯 Step 2: Clean and format category names nicely for UI
    const cleanCatKey = categoryQuery.toLowerCase().trim().replace(/-/g, '').replace(/_/g, '');
    let displayCategoryName = categoryQuery.replace(/-/g, ' ').replace(/_/g, ' ');
    
    // Synced Translation mappings for standardized tags
    if (cleanCatKey === "cybersecurity" || cleanCatKey === "cybersecurity") {
        displayCategoryName = activeLang === "hi" ? "साइबर सुरक्षा" : "Cyber Security";
    } else if (cleanCatKey === "aifuture") {
        displayCategoryName = activeLang === "hi" ? "एआई फ्यूचर" : "AI Future";
    } else if (cleanCatKey === "appsandinternet") {
        displayCategoryName = activeLang === "hi" ? "ऐप्स और इंटरनेट" : "Apps & Internet";
    }

    // Update Meta and document headers immediately
    document.title = `${displayCategoryName} | TyagiHub`;
    postsHeading.textContent = activeLang === "hi" ? `श्रेणी: ${displayCategoryName}` : `Category: ${displayCategoryName}`;

    // 🎯 Step 3: Parse internal master dataset buffer
    try {
        const rawJsonData = document.getElementById('tyagihub-master-json').textContent;
        const allPosts = JSON.parse(rawJsonData || "[]");

        // Strict validation engine sorting lang properties and matching against normalized strings
        const categoryPosts = allPosts.filter(post => {
            if (!post.category) return false;
            
            // Check language constraint lock
            if (post.lang !== activeLang) return false;

            const targetPostCat = post.category.toLowerCase().replace(/-/g, '').replace(/_/g, '');
            return targetPostCat === cleanCatKey;
        });

        // 🎯 Step 4: Render dynamic HTML cards matching discover horizontal framework
        postsGrid.innerHTML = ''; // Clear fallback spinner

        if (categoryPosts.length === 0) {
            postsGrid.innerHTML = activeLang === "hi" 
                ? '<p style="color: var(--text-muted); padding: 40px; text-align: center;">इस श्रेणी में कोई लेख नहीं मिला।</p>' 
                : '<p style="color: var(--text-muted); padding: 40px; text-align: center;">No articles found in this category.</p>';
            return;
        }

        categoryPosts.forEach(p => {
            const shareText = activeLang === "hi" ? "शेयर" : "Share";
            const readMoreText = activeLang === "hi" ? "पूरा पढ़ें →" : "Read More →";

            const cardHTML = `
                <div class="horizontal-post-card js-post" data-lang="${p.lang}" data-post-url="${p.url}">
                    <div class="post-img" style="position: relative; overflow: hidden; background: #111216; display: flex; align-items: center; justify-content: center; width: 354px; height: 236px; flex-shrink: 0; border-radius: 12px;">
                        <span class="post-category" style="z-index: 10;">${p.display_chip}</span>
                        <div class="post-date" style="z-index: 10;">
                            <i class="fa-regular fa-calendar"></i> ${p.date}
                        </div>
                        <div class="thumb-media-box" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
                            <img src="${p.image}" alt="${p.title}" title="${p.title}" loading="lazy" style="width:100%; height:100%; object-fit:cover; display:block;">
                        </div>
                    </div>
                    
                    <div class="post-info" style="display: flex; flex-direction: column; justify-content: space-between; padding: 10px 0; width: 100%;">
                        <div class="post-top-meta">
                            <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 10px; line-height: 1.4;">
                                <a href="${p.url}" style="text-decoration: none; color: var(--clr-heading, #fff);">
                                    ${p.title}
                                </a>
                            </h2>
                            <p style="font-size: 14px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                                ${p.description}
                            </p>
                        </div>
                        
                        <div class="post-footer" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                            <button class="native-share-btn" onclick="if(navigator.share){navigator.share({title:'${p.title.replace(/'/g, "\\'")}',url:'${window.location.origin}${p.url}'})}else{navigator.clipboard.writeText('${window.location.origin}${p.url}');alert('Link Copied!')}" style="display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="18" cy="5" r="3"></circle>
                                    <circle cx="6" cy="12" r="3"></circle>
                                    <circle cx="18" cy="19" r="3"></circle>
                                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                                </svg>
                                <span>${shareText}</span>
                            </button>
                            <a href="${p.url}" class="read-link" style="text-decoration: none; color: #16a34a; font-weight: 600; font-size: 14px;">
                                ${readMoreText}
                            </a>
                        </div>
                    </div>
                </div>
            `;
            postsGrid.insertAdjacentHTML('beforeend', cardHTML);
        });

    } catch (e) {
        console.error("Master JSON execution error:", e);
        postsHeading.textContent = 'Error';
        postsGrid.innerHTML = `<p style="color: var(--text-muted); padding: 20px;">Could not load items. Please verify configuration build.</p>`;
    }
});
</script>
