---
layout: default
title: "Explore Categories & Insights "
extra_css:
  - /assets/css/discover.css
---

<!-- Premium Advanced Grid & Controls Styling Layer -->
<style>
  :root {
    --brand-primary: #16a34a;
    --brand-primary-hover: #15803d;
    --glass-bg: rgba(255, 255, 255, 0.02);
    --glass-border: rgba(255, 255, 255, 0.07);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  .premium-cat-wrapper {
    max-width: 1200px;
    margin: 50px auto;
    padding: 0 20px;
    min-height: 75vh;
  }

  /* Header Architecture */
  .cat-header-zone {
    text-align: center;
    margin-bottom: 40px;
  }

  .cat-main-heading {
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.02em;
    margin: 0 0 10px 0;
  }

  /* Controls Framework: Search & Filter Chips Wrapper */
  .controls-hub {
    display: flex;
    flex-direction: column;
    gap: 25px;
    margin-bottom: 45px;
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid var(--glass-border);
    padding: 25px;
    border-radius: 20px;
  }

  /* Premium Search Controller */
  .search-box-wrap {
    position: relative;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
  }

  .premium-search-input {
    width: 100%;
    padding: 14px 20px 14px 45px;
    border: 2px solid var(--glass-border);
    border-radius: 30px;
    background: #0f172a;
    color: var(--text-main);
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
  }

  .premium-search-input:focus {
    border-color: var(--brand-primary);
    box-shadow: 0 0 15px rgba(22, 163, 74, 0.15);
  }

  .search-icon-lens {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  /* Dynamic Filter Chips Engine */
  .filter-chips-track {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .filter-chip-btn {
    padding: 10px 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-muted);
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .filter-chip-btn:hover {
    border-color: rgba(22, 163, 74, 0.4);
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.04);
  }

  .filter-chip-btn.active-chip-state {
    background: var(--brand-primary);
    border-color: var(--brand-primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
  }

  /* 3-Column 15-Post Balanced Grid Layout (1 row has 3 columns on Desktop) */
  .premium-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 30px;
  }

  @media(min-width: 768px) {
    .premium-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media(min-width: 1024px) {
    .premium-grid {
      grid-template-columns: repeat(3, 1fr); /* Strict 3 Columns */
    }
  }

  /* Luxury Card Layout Architecture */
  .luxury-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
  }

  .luxury-card:hover {
    transform: translateY(-6px);
    border-color: rgba(22, 163, 74, 0.4);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }

  .card-media-wrap {
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    position: relative;
    background: #0f172a;
  }

  .card-media-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .luxury-card:hover .card-media-wrap img {
    transform: scale(1.04);
  }

  .card-body-content {
    padding: 22px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .card-meta-line {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .card-title-anchor {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text-main);
    text-decoration: none;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: color 0.2s ease;
  }

  .card-title-anchor:hover {
    color: var(--brand-primary);
  }

  .card-desc-text {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    margin: 0 0 20px 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer-action {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 14px;
    border-top: 1px solid var(--glass-border);
  }

  .premium-read-btn {
    font-size: 14px;
    font-weight: 600;
    color: var(--brand-primary);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .premium-read-btn:hover {
    color: var(--brand-primary-hover);
  }

  .premium-share-icon-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .premium-share-icon-btn:hover {
    color: var(--text-main);
  }

  /* High-End Pagination Engine */
  .premium-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 50px;
  }

  .premium-page-btn {
    min-width: 40px;
    height: 40px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--text-main);
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .premium-page-btn:hover:not(:disabled) {
    border-color: var(--brand-primary);
    color: var(--brand-primary);
  }

  .premium-page-btn.active-page-state {
    background: var(--brand-primary);
    border-color: var(--brand-primary);
    color: #fff;
  }

  .premium-page-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .luxury-spinner {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 0;
  }
</style>

<!-- Main Container Element Blueprint -->
<main class="premium-cat-wrapper">
    <div class="cat-header-zone">
        <h1 id="category-posts-heading" class="cat-main-heading">{% if page.lang == "hi" %}लेख श्रेणियां{% else %}Article Archive{% endif %}</h1>
    </div>

    <!-- Controls Hub: Live Filter Chips Container & Search Box -->
    <div class="controls-hub">
        <div class="search-box-wrap">
            <i class="fa-solid fa-magnifying-glass search-icon-lens"></i>
            <input type="text" id="premium-live-search" class="premium-search-input" placeholder="{% if page.lang == "hi" %}लेख खोजें...{% else %}Search active articles...{% endif %}">
        </div>
        
        <div id="filter-chips-track-box" class="filter-chips-track">
           <!-- Dynamic category switcher buttons injected here by JS -->
        </div>
    </div>
    
    <!-- 3-Column Grid Container displaying up to 15 posts per page view -->
    <div id="category-post-grid" class="premium-grid">
        <div class="luxury-spinner" style="color:var(--brand-primary);">
            <i class="fas fa-spinner fa-spin" style="font-size:30px;"></i>
        </div>
    </div>

    <!-- Pagination Interface Structure -->
    <nav id="premium-pagination-container" class="premium-pagination"></nav>
</main>

<!-- Unified Site Dataset Architecture JSON layer mapped from all dynamic collections -->
<script id="tyagihub-master-json" type="application/json">
[
  {% assign all_site_posts = "" | split: "" %}
  {% for p in site.posts %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  {% for p in site.posts_hi %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  {% for p in site.shield %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  {% for p in site.shield_hi %}{% assign all_site_posts = all_site_posts | push: p %}{% endfor %}
  
  {% for p in all_site_posts %}
    {
      "title": {{ p.title | jsonify }},
      "url": {{ p.url | relative_url | jsonify }},
      "description": {{ p.description | default: p.excerpt | strip_html | truncate: 120 | jsonify }},
      "image": {{ p.image | default: '/assets/images/default-thumb.png' | jsonify }},
      "date": {{ p.date | date: "%d %b %Y" | jsonify }},
      "lang": {{ p.lang | default: 'en' | jsonify }},
      "category": {% if p.categories %}{{ p.categories[0] | jsonify }}{% else %}{{ p.category | jsonify }}{% endif %},
      "display_chip": {% if p.categories %}{{ p.categories[0] | replace: "-", " " | replace: "_", " " | capitalize | jsonify }}{% else %}{{ p.category | replace: "-", " " | replace: "_", " " | capitalize | jsonify }}{% endif %}
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // 🎯 STRICT RULE PARAMETERS SETTING
    const POSTS_PER_PAGE = 15; // Shows exactly 15 records maximum per view block

    const postsGrid = document.getElementById('category-post-grid');
    const postsHeading = document.getElementById('category-posts-heading');
    const chipsTrack = document.getElementById('filter-chips-track-box');
    const paginationNav = document.getElementById('premium-pagination-container');
    const liveSearchInput = document.getElementById('premium-live-search');

    const isHindiContext = window.location.pathname.includes('/hi/') || document.referrer.includes('/hi/');
    const activeLang = isHindiContext ? "hi" : "en";

    const normalizeStr = (str) => {
        if (!str) return "";
        return str.toString().toLowerCase().replace(/[-_\s]/g, '').trim();
    };

    // Parse URL parameter block securely
    const urlParams = new URLSearchParams(window.location.search);
    let currentSelectedCategoryKey = normalizeStr(urlParams.get('category') || "all");
    let searchFilterQuery = "";

    let masterSiteDataset = [];
    let filteredPostsSubset = [];
    let currentPageIndex = 1;

    try {
        const rawJsonData = document.getElementById('tyagihub-master-json').textContent;
        const allPosts = JSON.parse(rawJsonData || "[]");

        // Filter out records matching language baseline constraint lock immediately
        masterSiteDataset = allPosts.filter(post => post.lang === activeLang);
        
        buildCategoryChipsMenu();
        applyFilterLogicPipeline();

    } catch (e) {
        console.error("Master JSON parser execution fault:", e);
        postsGrid.innerHTML = `<p style="color:var(--text-muted); text-align:center; grid-column:1/-1;">Parsing Exception.</p>`;
    }

    // 🎯 Step 1: Render All Available Dynamic Category Buttons / Chips automatically
    function buildCategoryChipsMenu() {
        chipsTrack.innerHTML = '';
        
        // Add default 'ALL' button mapping
        const allLabel = activeLang === "hi" ? "सभी लेख" : "All Posts";
        const allBtn = document.createElement('button');
        allBtn.className = `filter-chip-btn ${currentSelectedCategoryKey === "all" ? 'active-chip-state' : ''}`;
        allBtn.innerText = allLabel;
        allBtn.addEventListener('click', () => switchCategoryState("all", allBtn));
        chipsTrack.appendChild(allBtn);

        // Scan dataset to isolate unique operational category keys
        const uniqueCategoryMap = new Map();
        masterSiteDataset.forEach(p => {
            if (!p.category) return;
            const normKey = normalizeStr(p.category);
            if (!uniqueCategoryMap.has(normKey)) {
                uniqueCategoryMap.set(normKey, p.display_chip);
            }
        });

        // Loop over mappings injecting standalone responsive trigger chips
        uniqueCategoryMap.forEach((displayTitle, normKey) => {
            let polishedTitle = displayTitle;
            if (normKey === "cybersecurity") polishedTitle = activeLang === "hi" ? "साइबर सुरक्षा" : "Cyber Security";
            if (normKey === "technology") polishedTitle = activeLang === "hi" ? "तकनीक" : "Technology";
            if (normKey === "appsandinternet") polishedTitle = activeLang === "hi" ? "ऐप्स और इंटरनेट" : "Apps & Internet";

            const btn = document.createElement('button');
            btn.className = `filter-chip-btn ${currentSelectedCategoryKey === normKey ? 'active-chip-state' : ''}`;
            btn.innerText = polishedTitle;
            btn.addEventListener('click', () => switchCategoryState(normKey, btn));
            chipsTrack.appendChild(btn);
        });
    }

    // Category Controller State Shift Module
    function switchCategoryState(targetNormKey, clickedButtonElement) {
        document.querySelectorAll('.filter-chip-btn').forEach(b => b.classList.remove('active-chip-state'));
        clickedButtonElement.classList.add('active-chip-state');
        
        currentSelectedCategoryKey = targetNormKey;
        currentPageIndex = 1; // reset page bounds
        
        // Update browser URL query trace state silently without hard refresh friction
        const dynamicQueryParam = targetNormKey === "all" ? window.location.pathname : `?category=${targetNormKey}`;
        window.history.replaceState({}, "", dynamicQueryParam);
        
        applyFilterLogicPipeline();
    }

    // 🎯 Step 2: Live Search Input Event Capture Listener
    if (liveSearchInput) {
        liveSearchInput.addEventListener('input', (e) => {
            searchFilterQuery = e.target.value.toLowerCase().trim();
            currentPageIndex = 1;
            applyFilterLogicPipeline();
        });
    }

    // 🎯 Step 3: Combined Multi-Stage Filtering Pipeline (Category Lock + Live Typing Query)
    function applyFilterLogicPipeline() {
        filteredPostsSubset = masterSiteDataset.filter(post => {
            // Stage A: Category Matching Check
            if (currentSelectedCategoryKey !== "all") {
                if (normalizeStr(post.category) !== currentSelectedCategoryKey) return false;
            }
            
            // Stage B: Search Query Matching Check
            if (searchFilterQuery !== "") {
                const titlePool = post.title.toLowerCase();
                const descPool = post.description.toLowerCase();
                if (!titlePool.includes(searchFilterQuery) && !descPool.includes(searchFilterQuery)) return false;
            }

            return true;
        });

        executeGridRenderLifecycle();
    }

    // 🎯 Step 4: Core Grid Elements Drawing Lifecycle Layout Engine
    function executeGridRenderLifecycle() {
        postsGrid.innerHTML = '';
        paginationNav.innerHTML = '';

        if (filteredPostsSubset.length === 0) {
            postsGrid.innerHTML = activeLang === "hi"
                ? '<p style="color:var(--text-muted); text-align:center; padding:40px; grid-column:1/-1;">कोई संबंधित लेख नहीं मिला।</p>'
                : '<p style="color:var(--text-muted); text-align:center; padding:40px; grid-column:1/-1;">No matching articles found in archive.</p>';
            return;
        }

        // Calculate chunk boundaries array indices mapping
        const start = (currentPageIndex - 1) * POSTS_PER_PAGE;
        const end = start + POSTS_PER_PAGE;
        const ActiveSliceChunk = filteredPostsSubset.slice(start, end);

        ActiveSliceChunk.forEach(p => {
            const readLabel = activeLang === "hi" ? "पूरा पढ़ें" : "Read More";
            
            const cardHTML = `
                <article class="luxury-card">
                    <div class="card-media-wrap">
                        <img src="${p.image}" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="card-body-content">
                        <div class="card-meta-line">
                            <span><i class="fa-regular fa-calendar"></i> ${p.date}</span>
                            <span>•</span>
                            <span>🧠 ${p.display_chip}</span>
                        </div>
                        <a href="${p.url}" class="card-title-anchor">${p.title}</a>
                        <p class="card-desc-text">${p.description}</p>
                        
                        <div class="card-footer-action">
                            <a href="${p.url}" class="premium-read-btn">
                                ${readLabel} <i class="fa-solid fa-arrow-right-long" style="font-size:12px; margin-left:4px;"></i>
                            </a>
                            <button class="premium-share-icon-btn" onclick="triggerNativeSystemShare('${p.title.replace(/'/g, "\\'")}', '${p.url}')" aria-label="Share article">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="18" cy="5" r="3"></circle>
                                    <circle cx="6" cy="12" r="3"></circle>
                                    <circle cx="18" cy="19" r="3"></circle>
                                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </article>
            `;
            postsGrid.insertAdjacentHTML('beforeend', cardHTML);
        });

        generatePaginationInterface();
    }

    // Dynamic Navigation Pager Module Block
    function generatePaginationInterface() {
        const totalPages = Math.ceil(filteredPostsSubset.length / POSTS_PER_PAGE);
        if (totalPages <= 1) return;

        const appendBtn = (pageIndex, label, isDisabled = false, isActive = false) => {
            const btn = document.createElement('button');
            btn.className = `premium-page-btn ${isActive ? 'active-page-state' : ''}`;
            btn.innerText = label;
            btn.disabled = isDisabled;
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                currentPageIndex = pageIndex;
                executeGridRenderLifecycle();
                window.scrollTo({ top: postsHeading.offsetTop - 40, behavior: 'smooth' });
            });
            paginationNav.appendChild(btn);
        };

        appendBtn(currentPageIndex - 1, "←", currentPageIndex === 1);

        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPageIndex - 1 && i <= currentPageIndex + 1)) {
                appendBtn(i, i, false, i === currentPageIndex);
            } else if (i === currentPageIndex - 2 || i === currentPageIndex + 2) {
                const span = document.createElement('span');
                span.innerText = "...";
                span.style.color = "var(--text-muted)";
                span.style.padding = "0 4px";
                paginationNav.appendChild(span);
            }
        }

        appendBtn(currentPageIndex + 1, "→", currentPageIndex === totalPages);
    }
});

function triggerNativeSystemShare(title, path) {
    const fullUrl = `${window.location.origin}${path}`;
    if (navigator.share) {
        navigator.share({ title: title, url: fullUrl }).catch(console.error);
    } else {
        navigator.clipboard.writeText(fullUrl).then(() => alert("Link copied to clipboard!"));
    }
}
</script>
