name: Build and Deploy Jekyll with Vite Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Node Setup (Vite aur CSS dono ke liye)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 2: CSS ko Merge aur Minify karo
      - name: Merge and Minify CSS
        run: |
          npm install -g clean-css-cli
          cleancss -o assets/css/search-main.css assets/css/main.css assets/css/search.css

      # Step 3: Agar root par package.json hai toh hi chalao, warna skip ho jayega
      - name: Install Node Dependencies & Build Vite (If exists)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          else
            echo "package.json nahi mili, Vite build skip kar rahe hain."
          fi

      # Step 4: Ruby aur Jekyll Setup
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # Step 5: Jekyll build chalao (Jo sabko final '_site' folder mein convert karega)
      - name: Install Ruby dependencies & Build Jekyll
        run: |
          bundle install
          bundle exec jekyll build

      # Step 6: HTML Formatting
      - name: Format HTML
        run: |
          npm install -g js-beautify
          find _site -type f -name "*.html" -exec html-beautify \
            --indent-size 2 \
            --preserve-newlines false \
            --max-preserve-newlines 0 \
            -r {} \;

      # Step 7: Final deployment ke liye artifact upload karo
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
