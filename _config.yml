# =============================================================
# TyagiHub - Tyagi MultiTech Ecosystem Platform
# Jekyll Configuration
# =============================================================

title: "TyagiHub"
tagline: "India's Creator & Developer Ecosystem"
description: "TyagiHub by Tyagi MultiTech — Learn, Create, Build, and Secure. One platform for creators, students, and developers."
baseurl: ""
url: "https://tyagihub.in"

# Brand
brand:
  name: "TyagiHub"
  parent: "Tyagi MultiTech"
  tagline: "Create. Learn. Build."
  logo: "/assets/images/logo.svg"
  favicon: "/assets/images/favicon.ico"

# Author / Organization
author:
  name: "Tyagi MultiTech"
  email: "hello@tyagihub.in"
  twitter: "@TyagiMultiTech"
  github: "TyagiMultiTech"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .gitignore
  - tools/pdf-source
  - tools/pdf-source/node_modules
  - README.md
  - ARCHITECTURE.md

# Include
include:
  - admin
  - _pages
  - robots.txt
  - sitemap.xml

# Collections
collections:
  tools:
    output: true
    permalink: /tools/:name/
  learn:
    output: true
    permalink: /learn/:name/
  apps:
    output: true
    permalink: /apps/:name/

  posts_hi:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Tyagi MultiTech"

  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"

  - scope:
      path: ""
      type: "learn"
    values:
      layout: "learn"

  - scope:
      path: ""
    values:
      layout: "quiz-player"

  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Plugins (GitHub Pages safe)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO
twitter:
  username: TyagiMultiTech
  card: summary_large_image

social:
  name: Tyagi MultiTech
  links:
    - https://twitter.com/TyagiMultiTech
    - https://github.com/TyagiMultiTech

# Analytics - NONE (privacy-first)
google_analytics: false

# Future backend API endpoint (placeholder)
api:
  base_url: "https://api.tyagihub.in/v1"
  enabled: false
