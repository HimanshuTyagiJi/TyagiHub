# =============================================================
# TyagiHub - Tyagi MultiTech Ecosystem Platform
# Jekyll Configuration
# ============================================================= 
   
title: "TyagiHub"
tagline: "India's Creator & Developer Ecosystem"
description: "TyagiHub by Tyagi MultiTech — Learn, Create, Build, and Secure. One platform for creators, students, and developers."
baseurl: "" 
url: "https://tyagihub.in"

# Brand
brand:
  name: "TyagiHub"
  parent: "Tyagi MultiTech"
  tagline: "Create. Learn. Build."
  logo: "/assets/images/logo.svg"
  favicon: "/assets/images/favicon.ico"

# Author / Organization
author:
  name: "Tyagi MultiTech"
  email: "hello@tyagihub.in"
  twitter: "@TyagiMultiTech"
  github: "TyagiMultiTech"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .gitignore
  - tools/pdf-source
  - tools/pdf-source/node_modules
  - README.md
  - ARCHITECTURE.md

# Include
include:
  - admin
  - _pages
  - robots.txt
  - sitemap.xml
  - _data          # <-- BAS YEH EK LINE ISI BLOCK KE NICHE JOD DE
  - learn
# =============================================================
# TyagiHub - Clean Config (No Conflicts)
# =============================================================

# Collections (SARI COLLECTIONS EK JAGAH)
collections:
  tools:
    output: true
    permalink: /tools/:name/
  learn:
    output: true
    permalink: /learn/:name/
  apps:
    output: true
    permalink: /apps/:name/
  posts_hi:
    output: true
  shield:
    output: true
    permalink: /shield/:name/
  shield_hi:
    output: true
    permalink: /hi/shield/:name/
  tests_en:
    output: true
    permalink: /:name/
    
  tests_hi:
    output: true
    permalink: /hi/:name/


# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Tyagi MultiTech"
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"
  - scope:
      path: ""
      type: "learn"
    values:
      layout: "learn"
  - scope:
      path: ""
    values:
      layout: "quiz-player"
 - scope:
      path: ""
      type: "tests_en"
    values:
      layout: "test-player"
      lang: "en"
  - scope:
      path: ""
      type: "tests_hi"
    values:
      layout: "test-player"
      lang: "hi"

  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
sitemap:
  exclude:
    - "/tag/**/*"
    - "/tags/**/*"
# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate-v2

# Discover Pagination (Ye tumhare main posts ke liye hai)
pagination:
  enabled: true
  per_page: 12
  permalink: "/page-:num/"
  title: ":title - Page :num"
  limit: 0
  sort_by: "date"
  sort_reverse: true

# Autopages Infrastructure (Fixed: Ab ye sirf 'discover' layout use karega)
# Autopages Infrastructure (Fixed: Tags strictly disabled to stop 404 links 🚀)
autopages:
  enabled: true
  categories:
    enabled: true
    layouts:
      - "discover"
    permalink: "/:name/"
    slugify:
      mode: "default"
      cased: false
  # 🎯 YEH VALI LINE JADU HAI: Yeh fake tag pages ko generate hone se jad se rok degi
  tags:
    enabled: false
# SEO
twitter:
  username: TyagiMultiTech
  card: summary_large_image

social:
  name: Tyagi MultiTech
  links:
    - https://twitter.com/TyagiMultiTech
    - https://github.com/TyagiMultiTech

# Analytics - NONE (privacy-first)
google_analytics: false

# Future backend API endpoint (placeholder)
api:
  base_url: "https://api.tyagihub.in/v1"
  enabled: false

quiz:
  questions_per_page: 25  # Change to 25 for production

